[workspace]
resolver = "3"
members = ["apps/asvgxmled", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/asvgxmled"
rust-version = "1.98"

[workspace.dependencies]
kurbo = "0.13"
lyon_tessellation = "1.0.22"
lyon_path = "1.0"
quick-xml = "0.41"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

repose-core = { path = "../repose/crates/repose-core", version = "0.35.4" }
repose-ui = { path = "../repose/crates/repose-ui", version = "0.35.4" }
repose-material = { path = "../repose/crates/repose-material", version = "0.35.4" }
repose-canvas = { path = "../repose/crates/repose-canvas", version = "0.35.4" }
repose-platform = { path = "../repose/crates/repose-platform", version = "0.35.4" }
repose-render-wgpu = { path = "../repose/crates/repose-render-wgpu", version = "0.35.4" }
repose-text = { path = "../repose/crates/repose-text", version = "0.35.4" }

vector-model = { path = "crates/vector-model", version = "0.1.0" }
vector-render = { path = "crates/vector-render", version = "0.1.0" }

[profile.release]
lto = "thin"
