[workspace]
resolver = "3"
members = ["apps/asvgxmled", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/asvgxmled"
rust-version = "1.98"

[workspace.dependencies]
kurbo = "0.13"
lyon_tessellation = "1.0.22"
lyon_path = "1.0"
quick-xml = "0.41"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

repose-core = "0.35.5"
repose-ui = "0.35.5"
repose-material = "0.35.5"
repose-canvas = "0.35.5"
repose-platform = "0.35.5"
repose-render-wgpu = "0.35.5"
repose-text = "0.35.5"

vector-model = { path = "crates/vector-model", version = "0.1.0" }
vector-render = { path = "crates/vector-render", version = "0.1.0" }

[profile.release]
lto = "thin"
